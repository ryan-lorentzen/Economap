version: 1
applications:
  - appRoot: frontend/economap-frontend
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: frontend/economap-frontend
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci --prefix frontend/economap-frontend
            - printf 'GOOGLE_PLACES_API_KEY=%s\n' "$GOOGLE_PLACES_API_KEY" > frontend/economap-frontend/.env.production
        build:
          commands:
            - npm run build --prefix frontend/economap-frontend
      artifacts:
        baseDirectory: frontend/economap-frontend/.next
        files:
          - '**/*'
      cache:
        paths:
          - frontend/economap-frontend/node_modules/**/*
